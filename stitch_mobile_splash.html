<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Sentinel - Rural Health Early Warning Network</title>
<!-- Google Fonts: Inter & Plus Jakarta Sans for friendly, ultra-legible typography -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#0D5C57',
              tealDark: '#093E3A',
              tealLight: '#14756F',
              amber: '#D98E3A',
              amberLight: '#F3B468',
              surface: '#F8F9FF',
              offwhite: '#F4F7F6',
              borderTeal: 'rgba(13, 92, 87, 0.12)'
            }
          },
          fontFamily: {
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
            sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    };
  </script>
<!-- Custom Styles for Mobile Device Preview & Loading Animations -->
<style data-purpose="device-frame">
    /* Canvas backdrop for desktop viewing while preserving authentic mobile 390px aspect ratio */
    body {
      background-color: #0c1a19;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* iOS Mobile Frame Container (iPhone-standard 390x844 approx) */
    .mobile-screen {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #093E3A 0%, #0D5C57 38%, #EAF2F1 72%, #F8F9FF 100%);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media (max-width: 480px) {
      body {
        background-color: #093E3A;
      }
      .mobile-screen {
        max-width: 100%;
        height: 100vh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
<style data-purpose="animations">
    /* Subtle pulsing glow behind the brand shield */
    @keyframes subtle-breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.6;
      }
    }

    .pulse-glow {
      animation: subtle-breathe 4s ease-in-out infinite;
    }

    /* Progress bar smooth indeterminate glow fill */
    @keyframes load-progress {
      0% {
        width: 12%;
        left: 0%;
      }
      50% {
        width: 58%;
        left: 32%;
      }
      100% {
        width: 25%;
        left: 80%;
      }
    }

    .progress-bar-glow {
      animation: load-progress 2.4s ease-in-out infinite alternate;
    }

    /* Gentle fade-in for primary text hierarchy */
    @keyframes gentle-rise {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-gentle-rise {
      animation: gentle-rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>
<!-- BEGIN: MobileScreenContainer -->
<main class="mobile-screen select-none" data-purpose="splash-screen-root">
<!-- BEGIN: iOSStatusBarArea -->
<!-- Native iOS simulated top bar with speaker notch & status items -->
<header class="w-full pt-3 px-7 flex items-center justify-between z-20 text-white/80" data-purpose="ios-status-bar">
<!-- Time display -->
<span class="text-[14px] font-semibold tracking-tight">09:41</span>
<!-- Dynamic Island / Speaker Pill indicator placeholder -->
<div class="w-24 h-4 bg-black/30 rounded-full mx-auto backdrop-blur-sm"></div>
<!-- Battery and Signal Indicators -->
<div aria-hidden="true" class="flex items-center space-x-1.5">
<!-- Signal bars -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.22.25-.2.63.05.85.25.22.63.2.85-.05l.77-.87C7.68 19.34 9.73 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path>
</svg>
<!-- Offline-first network indicator dot -->
<div class="w-1.5 h-1.5 rounded-full bg-brand-amber"></div>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-current rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBarArea -->
<!-- BEGIN: CenteredBrandIdentity -->
<!-- Main emblem, large clear app title, and welcoming rural health descriptor -->
<section class="flex-1 flex flex-col items-center justify-center px-6 -mt-8 text-center z-10" data-purpose="app-branding">
<!-- Emblem Graphic Container with soft comforting amber/teal aura -->
<div class="relative flex items-center justify-center mb-6" data-purpose="emblem-wrapper">
<!-- Soft glowing halo behind emblem -->
<div aria-hidden="true" class="absolute w-36 h-36 rounded-full bg-brand-amber/20 blur-xl pulse-glow"></div>
<div aria-hidden="true" class="absolute w-28 h-28 rounded-full bg-brand-tealLight/30 blur-lg"></div>
<!-- Emblem Frame: Clean rounded pill container with shadow and high visual contrast -->
<div class="relative w-28 h-28 rounded-3xl bg-brand-surface p-3.5 shadow-2xl shadow-teal-950/40 border border-white/60 flex items-center justify-center transform transition-transform">
<img alt="Vector emblem graphic icon on clean solid background: a protective curved health shield combined with a subtle pulse heartbeat line in deep teal #0d5c57 and warm amber #d98e3a, minimalist medical emblem, clean lines, high contrast, app icon mark" class="w-full h-full object-contain rounded-2xl drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFGz390KIW6YOmexq8jPvBwSpQrPsmUuM-KqKjeIMnyasxT5MGqZp8SbGPp7oDSqpKmZ6M3aq36ZRIeuASxoJCjRJ6Qd4quNQmFD2Z3VaouQWpqsu2SPBkfirhW8hHdfWTfYbr89RJhHt3AuIAu-MuRct2yUMMN-1jBsliEM7Ko2yHZkkpY7IxjVZ9YbB4wCO0iDe5M3tGBWiuSepCsSF2MvjWXTjHW9k2P29hkFFwAyjsi5wigyVYrQ">
</div>
</div>
<!-- App Name Header: Large, bold, highly legible for low-literacy users -->
<div class="space-y-1.5 animate-gentle-rise" data-purpose="title-and-subtitle">
<h1 class="text-4xl font-extrabold font-display tracking-tight text-white drop-shadow-sm">
          Sentinel
        </h1>
<!-- Accessible Subtitle: Clear, calming, reassurance-focused -->
<p class="text-emerald-100/90 text-base font-medium tracking-wide">
          Community Health Network
        </p>
</div>
<!-- Simple visual icon badge for quick rural recognition -->
<div class="mt-4 inline-flex items-center space-x-2 px-3.5 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-white/90">
<svg class="w-3.5 h-3.5 text-brand-amber fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
<span class="text-xs font-semibold tracking-wider uppercase text-emerald-50">Early Warning Shield</span>
</div>
</section>
<!-- END: CenteredBrandIdentity -->
<!-- BEGIN: BottomLoadingAndStatus -->
<!-- Non-intrusive, low-stress loading indicator & institutional verification -->
<footer class="w-full pb-8 pt-4 px-6 flex flex-col items-center justify-end z-10" data-purpose="status-and-loader">
<!-- Calm Horizontal Pill Progress Bar (Non-spinning, non-anxiety-inducing) -->
<div aria-label="Preparing application" aria-valuemax="100" aria-valuemin="0" class="w-44 h-1.5 bg-brand-teal/20 rounded-full overflow-hidden relative mb-3.5" role="progressbar">
<!-- Active warm amber loading pulse fill -->
<div class="h-full bg-brand-amber rounded-full relative progress-bar-glow shadow-[0_0_8px_rgba(217,142,58,0.7)]"></div>
</div>
<!-- Gentle reassuring state note -->
<p class="text-[13px] font-medium text-brand-tealDark/80 tracking-normal mb-6 flex items-center gap-1.5">
<span aria-hidden="true" class="inline-block w-2 h-2 rounded-full bg-brand-teal animate-pulse"></span>
        Preparing offline health data...
      </p>
<!-- Trust Stamp & Official Ministry Affiliation (Reassures low-literacy & rural users) -->
<div class="w-full pt-3 border-t border-brand-teal/15 flex flex-col items-center justify-center space-y-1 text-center" data-purpose="trust-footer">
<div class="flex items-center justify-center gap-1.5 text-[11px] font-bold text-brand-tealDark/90 uppercase tracking-wider">
<svg class="w-3.5 h-3.5 text-brand-teal shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Offline Capable</span>
<span class="text-brand-teal/40">•</span>
<span>District Sync</span>
</div>
<span class="text-[10px] text-brand-tealDark/60 font-medium">
          Ministry of Health &amp; Rural Health Posts
        </span>
</div>
<!-- iOS Home Bar Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-brand-tealDark/25 rounded-full mt-4"></div>
</footer>
<!-- END: BottomLoadingAndStatus -->
</main>
<!-- END: MobileScreenContainer -->
</body></html>
