</div>

<script>
  let currentLanguage = 'en';

  const translations = {
    en: {
      main: "What hurts?",
      sub: "Tap all pictures that match how you feel",
      counterSuffix: "symptoms chosen",
      noneChosen: "No symptoms selected yet",
      listenPrompt: "Listen in Swahili/English",
      readInstruction: "What hurts or feels wrong? Tap every symptom you feel."
    },
    swa: {
      main: "Unaumwa wapi?",
      sub: "Gusa picha zote zinazolingana na unavyojisikia",
      counterSuffix: "dalili zimechaguliwa",
      noneChosen: "Bado hakuna dalili iliyochaguliwa",
      listenPrompt: "Sikiliza kwa Kiswahili",
      readInstruction: "Unaumwa nini au unajisikiaje vibaya? Gusa kila dalili unayohisi."
    }
  };

  function setLang(lang, btnElement) {
    currentLanguage = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.remove('bg-primary', 'text-on-primary');
      btn.classList.add('text-on-surface-variant');
    });
    btnElement.classList.add('bg-primary', 'text-on-primary');
    btnElement.classList.remove('text-on-surface-variant');

    const t = translations[lang];
    document.getElementById('main-prompt-text').textContent = t.main;
    document.getElementById('sub-prompt-text').textContent = t.sub;
    updateCounter();
    speakPhrase(lang === 'swa' ? "Lugha imebadilishwa kuwa Kiswahili" : "Language set to English");
  }

  function speakPhrase(phrase) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.lang = currentLanguage === 'swa' ? 'sw' : 'en-US';
      window.speechSynthesis.speak(utterance);
    }
  }

  function playAudioPrompt() {
    const t = translations[currentLanguage];
    speakPhrase(t.readInstruction);
  }

  function updateCounter() {
    const selected = document.querySelectorAll('.symptom-card[aria-pressed="true"]').length;
    const counterEl = document.getElementById('selection-counter-text');
    const t = translations[currentLanguage];

    if (selected === 0) {
      counterEl.textContent = t.noneChosen;
    } else {
      counterEl.textContent = `${selected} ${t.counterSuffix}`;
    }
  }

  function toggleCard(card) {
    const isPressed = card.getAttribute('aria-pressed') === 'true';
    const newState = !isPressed;
    card.setAttribute('aria-pressed', String(newState));

    const checkPill = card.querySelector('.check-pill');
    const title = card.querySelector('.card-title');
    const subtitle = card.querySelector('.card-subtitle');
    const iconContainer = card.querySelector('div:first-child > div:first-child');

    if (newState) {
      // Selected visual state: deep teal solid fill, bright text and icon
      card.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      card.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md');

      iconContainer.classList.remove('bg-surface-container', 'text-primary');
      iconContainer.classList.add('bg-secondary-container/20', 'text-primary-fixed');

      checkPill.classList.remove('bg-surface-container-high', 'text-transparent');
      checkPill.classList.add('bg-primary-fixed', 'text-on-primary-fixed');

      title.classList.remove('text-on-surface');
      title.classList.add('text-on-primary');

      subtitle.classList.remove('text-on-surface-variant');
      subtitle.classList.add('text-primary-fixed-dim');

      const textToSpeak = currentLanguage === 'swa' 
        ? card.getAttribute('data-audio-swa') 
        : card.getAttribute('data-audio-en');
      speakPhrase(textToSpeak);
    } else {
      // Unselected state
      card.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md');
      card.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');

      iconContainer.classList.remove('bg-secondary-container/20', 'text-primary-fixed');
      iconContainer.classList.add('bg-surface-container', 'text-primary');

      checkPill.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
      checkPill.classList.add('bg-surface-container-high', 'text-transparent');

      title.classList.remove('text-on-primary');
      title.classList.add('text-on-surface');

      subtitle.classList.remove('text-primary-fixed-dim');
      subtitle.classList.add('text-on-surface-variant');
    }

    updateCounter();
  }

  function clearAllSelections() {
    document.querySelectorAll('.symptom-card[aria-pressed="true"]').forEach(card => {
      toggleCard(card);
    });
    speakPhrase(currentLanguage === 'swa' ? "Uchaguzi wote umefutwa" : "All selections cleared");
  }
